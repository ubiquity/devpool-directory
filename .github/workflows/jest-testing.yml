name: Directory sync regressions
on:
  workflow_dispatch:
  push:
    branches:
      - development
  pull_request:

env:
  NODE_ENV: "test"

jobs:
  testing:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci || npm install
      - name: Run sync regression tests
        run: npm test
